<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="380" viewBox="0 0 1200 380">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#718096"/></marker>
</defs>
<rect width="1200" height="380" fill="#ffffff"/>
<rect x="20" y="20" width="1160" height="340" rx="16" fill="#ffffff" stroke="#718096" stroke-width="2"/>
<text x="600" y="56" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2d3748" text-anchor="middle" font-weight="bold">One action, two very different jobs</text>
<rect x="60" y="90" width="500" height="240" rx="10" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="72" y="117" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a365d" text-anchor="start" font-weight="bold">Scenario  (decide)</text>
<text x="74" y="149" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a365d" text-anchor="start" font-weight="normal">• what to do, in what order</text>
<text x="74" y="179" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a365d" text-anchor="start" font-weight="normal">• random choices under constraints</text>
<text x="74" y="209" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a365d" text-anchor="start" font-weight="normal">• resources, data flow, scheduling</text>
<text x="74" y="239" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a365d" text-anchor="start" font-weight="normal"></text>
<text x="74" y="269" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a365d" text-anchor="start" font-weight="normal">test-specific; changes per test</text>
<rect x="640" y="90" width="500" height="240" rx="10" fill="#fff1e8" stroke="#9c4221" stroke-width="2"/>
<text x="652" y="117" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#652b19" text-anchor="start" font-weight="bold">Realization  (do)</text>
<text x="654" y="149" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#652b19" text-anchor="start" font-weight="normal">• how to make the device do it</text>
<text x="654" y="179" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#652b19" text-anchor="start" font-weight="normal">• register/memory programming</text>
<text x="654" y="209" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#652b19" text-anchor="start" font-weight="normal">• waiting for completion, errors</text>
<text x="654" y="239" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#652b19" text-anchor="start" font-weight="normal"></text>
<text x="654" y="269" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#652b19" text-anchor="start" font-weight="normal">device-specific; same for everyone</text>
<line x1="560" y1="210" x2="636" y2="210" stroke="#2d3748" stroke-width="2" marker-end="url(#ah)"/>
<text x="598" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#718096" text-anchor="middle" font-weight="normal">calls</text>
</svg>
