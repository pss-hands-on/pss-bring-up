<text x="504" y="165" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#2d3748" text-anchor="start" font-weight="normal">LOAD = 0x19</text>
<text x="940" y="164" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#718096" text-anchor="start" font-weight="normal" font-style="italic">raw value, one write</text>
