<text x="712" y="381" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#6b46c1" text-anchor="start" font-weight="bold">W</text>
<text x="734" y="381" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#2d3748" text-anchor="start" font-weight="normal">(cur&amp;~m)|(v&amp;m)</text>
<text x="940" y="380" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#718096" text-anchor="start" font-weight="normal" font-style="italic">read-modify-write</text>
<rect x="30" y="415" width="1140" height="50" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
<text x="50" y="446" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#742a2a" text-anchor="start" font-weight="bold">A field write still READS the register. If a read has side effects (clear-on-read), that matters.</text>
