<rect width="1200" height="470" fill="#ffffff"/>
<text x="30" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2d3748" text-anchor="start" font-weight="bold">What reaches the bus</text>
<text x="30" y="92" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#2d3748" text-anchor="start" font-weight="normal">regs.load.write(v)</text>
