<text x="32" y="347" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2d3748" text-anchor="start" font-weight="bold">Why per-channel components?</text>
<text x="34" y="377" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2d3748" text-anchor="start" font-weight="normal">• each channel binds its own bank → operations are index-free</text>
<text x="34" y="405" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2d3748" text-anchor="start" font-weight="normal">• offsets come from the generated group → stated once, in the RDL</text>
<text x="34" y="433" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2d3748" text-anchor="start" font-weight="normal">• pssc folds the offset to a constant: base + 0x100 + 0x100*i</text>
