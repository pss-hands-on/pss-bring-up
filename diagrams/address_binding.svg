<text x="32" y="47" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a365d" text-anchor="start" font-weight="bold">timer_c::initialize</text>
<text x="40" y="80" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#2d3748" text-anchor="start" font-weight="normal">solve function void initialize(addr_handle_t base) {</text>
<text x="40" y="106" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#2d3748" text-anchor="start" font-weight="normal">    regs.set_handle(base);</text>
<text x="40" y="132" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#2d3748" text-anchor="start" font-weight="normal">    foreach (ch[i]) {</text>
<text x="40" y="158" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#2d3748" text-anchor="start" font-weight="normal">        ch[i].initialize(i,</text>
<text x="40" y="184" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#2d3748" text-anchor="start" font-weight="normal">            make_handle_from_handle(base,</text>
<text x="40" y="210" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#2d3748" text-anchor="start" font-weight="normal">                regs.get_offset_of_instance_array("ch", i)));</text>
<text x="40" y="236" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#2d3748" text-anchor="start" font-weight="normal">    }</text>
